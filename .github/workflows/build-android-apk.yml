name: Build H&E Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Restore original H&E launcher icon
        run: |
          mkdir -p android-apk/app/src/main/res/drawable-nodpi
          curl -fL https://raw.githubusercontent.com/higgidius037-design/H-E/main/icon-512.png -o android-apk/app/src/main/res/drawable-nodpi/ic_launcher.png
          file android-apk/app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Configure permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing repository secret ANDROID_KEYSTORE_BASE64"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing repository secret ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing repository secret ANDROID_KEY_ALIAS"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing repository secret ANDROID_KEY_PASSWORD"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hande-release.jks"
          chmod 600 "$RUNNER_TEMP/hande-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/hande-release.jks" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/hande-release.jks" >> "$GITHUB_ENV"
          echo "Permanent signing key verified."

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK with permanent signing
        working-directory: android-apk
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Verify APK signature
        run: |
          APK="android-apk/app/build/outputs/apk/debug/app-debug.apk"
          apksigner verify --verbose "$APK"
          apksigner verify --print-certs "$APK"

      - name: Upload APK as a GitHub Release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-apk-v1"
          APK="android-apk/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" H-and-E.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" app-debug.apk --yes || true
            gh release upload "$TAG" H-and-E.apk --clobber
          else
            gh release create "$TAG" H-and-E.apk --title "H&E Android APK" --notes "Android installer for H&E – Our Little World. Signed with the permanent H&E update key."
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-and-E-Android-APK
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
