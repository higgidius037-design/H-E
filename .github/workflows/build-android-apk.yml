name: Build H&E Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-apk
        run: gradle assembleDebug

      - name: Upload APK as a GitHub Release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-apk-v1"
          APK="android-apk/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" H-and-E.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" app-debug.apk --yes || true
            gh release upload "$TAG" H-and-E.apk --clobber
          else
            gh release create "$TAG" H-and-E.apk --title "H&E Android APK" --notes "Android installer for H&E – Our Little World. Requires an internet connection."
          fi

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-and-E-Android-APK
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
