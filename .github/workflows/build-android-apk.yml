name: Build H&E Android APK

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 */5 * *'
  push:
    paths:
      - 'android-apk/**'
      - '.github/workflows/build-android-apk.yml'
      - 'approved-icon.svg'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore permanent signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hande-signing
          key: hande-signing-key-v1

      - name: Create signing key on first build only
        shell: bash
        run: |
          set -euo pipefail
          SIGN_DIR="$RUNNER_TEMP/hande-signing"
          mkdir -p "$SIGN_DIR"
          if [ ! -f "$SIGN_DIR/hande-release.jks" ]; then
            if [ -f android-signing-cert.sha256 ]; then
              echo "Permanent signing cache is missing. Refusing to create a replacement key because that would break updates."
              exit 1
            fi
            STORE_PASS="$(openssl rand -hex 32)"
            KEY_PASS="$(openssl rand -hex 32)"
            echo "$STORE_PASS" > "$SIGN_DIR/store-password"
            echo "$KEY_PASS" > "$SIGN_DIR/key-password"
            chmod 600 "$SIGN_DIR"/*
            keytool -genkeypair -v -keystore "$SIGN_DIR/hande-release.jks" -storetype JKS -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias hande-release -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=H&E Our Little World, OU=Mobile, O=H&E, L=Kenya, ST=Kenya, C=KE"
            echo "ANDROID_KEYSTORE_PATH=$SIGN_DIR/hande-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=hande-release" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            FINGERPRINT="$(keytool -list -v -keystore "$SIGN_DIR/hande-release.jks" -storepass "$STORE_PASS" -alias hande-release | awk -F': ' '/SHA256:/{print $2; exit}')"
            test -n "$FINGERPRINT"
            printf '%s\n' "$FINGERPRINT" > android-signing-cert.sha256
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android-signing-cert.sha256
            git commit -m "Record permanent H&E app signing certificate"
            git push
          else
            test -f "$SIGN_DIR/store-password"
            test -f "$SIGN_DIR/key-password"
            STORE_PASS="$(cat "$SIGN_DIR/store-password")"
            KEY_PASS="$(cat "$SIGN_DIR/key-password")"
            echo "ANDROID_KEYSTORE_PATH=$SIGN_DIR/hande-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=hande-release" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
            FINGERPRINT="$(keytool -list -v -keystore "$SIGN_DIR/hande-release.jks" -storepass "$STORE_PASS" -alias hande-release | awk -F': ' '/SHA256:/{print $2; exit}')"
            EXPECTED="$(tr -d '\r\n' < android-signing-cert.sha256)"
            test "$FINGERPRINT" = "$EXPECTED" || { echo "Signing key fingerprint mismatch. Build stopped to protect update compatibility."; exit 1; }
          fi

      - name: Use the exact H&E icon already supplied in the repository
        run: |
          mkdir -p android-apk/app/src/main/res/drawable-nodpi
          cp icon-512.png android-apk/app/src/main/res/drawable-nodpi/ic_launcher.png
          cp icon-512.png android-apk/app/src/main/res/drawable-nodpi/ic_launcher_round.png
          file icon-512.png android-apk/app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Register explicit adaptive launcher icon resources
        run: |
          mkdir -p android-apk/app/src/main/res/mipmap-anydpi-v26 android-apk/app/src/main/res/drawable
          mkdir -p android-apk/app/src/main/res/drawable-nodpi
          cat > android-apk/app/src/main/res/drawable/launcher_icon_background.xml <<'XML'
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">
              <solid android:color="#310B14"/>
          </shape>
          XML
          cat > android-apk/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/launcher_icon_background"/>
              <foreground android:drawable="@drawable/ic_launcher"/>
          </adaptive-icon>
          XML
          cat > android-apk/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'XML'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/launcher_icon_background"/>
              <foreground android:drawable="@drawable/ic_launcher"/>
          </adaptive-icon>
          XML

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK with permanent signing
        working-directory: android-apk
        run: gradle assembleDebug

      - name: Verify APK signature
        run: |
          APK="android-apk/app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"

      - name: Publish APK release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-apk-v1"
          APK="android-apk/app/build/outputs/apk/debug/app-debug.apk"
          cp "$APK" H-and-E.apk
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" app-debug.apk --yes || true
            gh release upload "$TAG" H-and-E.apk --clobber
          else
            gh release create "$TAG" H-and-E.apk --title "H&E Android APK" --notes "H&E – Our Little World. Signed with the permanent update key."
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: H-and-E-Android-APK
          path: android-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
